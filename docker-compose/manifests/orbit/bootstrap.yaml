apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-lens
  namespace: alpha-zone
spec:
  replicas: 6
  selector:
    matchLabels:
      app: orbit-lens
  template:
    metadata:
      labels:
        app: orbit-lens
        tier: frontend
    spec:
      serviceAccountName: orbit-runner
      containers:
        - name: orbit-lens
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat >/usr/share/nginx/html/index.html <<'EOF'
              rune fake-orbit-mesh orbit-lens
              EOF
              cat >/etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 8080;
                access_log /dev/stdout;
                error_log /dev/stderr notice;
                location / {
                  root /usr/share/nginx/html;
                }
                location /healthz {
                  default_type text/plain;
                  return 200 "orbit-lens ok\n";
                }
              }
              EOF
              nginx -g 'daemon off;'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-lens
  namespace: alpha-zone
spec:
  selector:
    app: orbit-lens
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: alpha-log-matrix
  namespace: alpha-zone
  annotations:
    kubectl.kubernetes.io/default-container: main
  labels:
    app: alpha-log-matrix
    tier: diagnostics
spec:
  restartPolicy: Always
  initContainers:
    - name: init-log
      image: busybox:1.36
      command: ["/bin/sh", "-ec"]
      args:
        - echo "alpha-log-matrix init complete"
  containers:
    - name: main
      image: busybox:1.36
      command: ["/bin/sh", "-ec"]
      args:
        - |
          index=0
          while true; do
            echo "alpha-log-matrix main tick index=${index}"
            index=$((index + 1))
            sleep 2
          done
    - name: sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-ec"]
      args:
        - |
          index=0
          while true; do
            echo "alpha-log-matrix sidecar tick index=${index}"
            index=$((index + 1))
            sleep 2
          done
---
apiVersion: v1
kind: Pod
metadata:
  name: alpha-previous-log-probe
  namespace: alpha-zone
  labels:
    app: alpha-previous-log-probe
    tier: diagnostics
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["/bin/sh", "-ec"]
      args:
        - |
          echo "alpha-previous-log-probe previous marker"
          sleep 1
          exit 1
