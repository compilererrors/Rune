              cat >/usr/share/nginx/html/index.html <<EOF
              rune fake-orbit-mesh orbit-vault $(hostname)
              EOF
              cat >/etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 9000;
                access_log /dev/stdout;
                error_log /dev/stderr notice;
                location / {
